<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tyre Price Intelligence Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { transition: background .3s; }
:root, [data-theme="night"] {
  --bg: #0b0d14; --surface: #151821; --surface2: #1e2230;
  --border: #282d3e; --text: #e8eaed; --text2: #8890a8;
  --primary: #6c5ce7; --primary-hover: #7f70f0; --primary-glow: rgba(108,92,231,0.2);
  --green: #27ae60; --red: #e74c3c; --amber: #f39c12; --blue: #3498db;
  --shadow: 0 1px 3px rgba(0,0,0,.3);
}
[data-theme="day"] {
  --bg: #f0f2f5; --surface: #ffffff; --surface2: #f4f6f9;
  --border: #d1d5db; --text: #1a1d23; --text2: #6b7280;
  --primary: #5b4cdb; --primary-hover: #4a3cc4; --primary-glow: rgba(91,76,219,0.18);
  --green: #16a34a; --red: #dc2626; --amber: #d97706; --blue: #2563eb;
  --shadow: 0 1px 3px rgba(0,0,0,.08);
}
body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; transition: background .3s, color .3s; }
.layout { display: flex; min-height: 100vh; }
.sidebar { width: 220px; background: var(--surface); border-right: 1px solid var(--border); padding: 20px 12px; flex-shrink: 0; position: sticky; top: 0; height: 100vh; overflow-y: auto; transition: background .3s; border-radius: 0 20px 20px 0; }
.sidebar-logo { font-size: 16px; font-weight: 800; letter-spacing: -0.3px; margin-bottom: 28px; display: flex; align-items: center; gap: 8px; }
.sidebar-logo span { background: linear-gradient(135deg, var(--primary), #a29bfe); color: #fff; width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--radius-sm); cursor: pointer; color: var(--text2); font-weight: 500; font-size: 13px; transition: all .18s; margin-bottom: 2px; }
.nav-item:hover { background: var(--surface2); color: var(--text); }
.nav-item.active { background: var(--primary-glow); color: var(--primary); font-weight: 600; }
.nav-item .icon { font-size: 16px; width: 20px; text-align: center; }
.main { flex: 1; padding: 22px 28px; max-width: calc(100vw - 220px); overflow-x: hidden; }
.header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
.header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; background: linear-gradient(135deg, var(--text), var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.header p { color: var(--text2); font-size: 13px; margin-top: 2px; -webkit-text-fill-color: var(--text2); }
.header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; border: none; cursor: pointer; transition: all .2s; font-family: inherit; text-decoration: none; }
.btn-primary { background: linear-gradient(135deg, var(--primary), #a29bfe); color: #fff; }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 16px var(--primary-glow); }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text2); }
.btn-outline:hover { border-color: var(--primary); color: var(--primary); }
.btn-sm { padding: 5px 10px; font-size: 11px; }
.btn-danger { background: var(--red); color: #fff; }
.btn-success { background: var(--green); color: #fff; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px 18px; transition: all .25s; box-shadow: var(--shadow); }
.card:hover { box-shadow: 0 4px 20px rgba(0,0,0,.12); }
.stat-card { border-radius: 16px; animation: liftIn .45s ease both; }
.stat-card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,0,0,.18); }
.card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.card-header h3 { font-size: 13px; font-weight: 600; color: var(--text2); }
.stat-value { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
.stat-label { font-size: 11px; color: var(--text2); margin-top: 1px; text-transform: uppercase; letter-spacing: .4px; }
.tabs { display: flex; gap: 3px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 3px; margin-bottom: 20px; overflow-x: auto; }
.tab { padding: 6px 16px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 500; cursor: pointer; color: var(--text2); border: none; background: none; font-family: inherit; white-space: nowrap; transition: all .18s; }
.tab:hover { color: var(--text); }
.tab.active { background: var(--primary); color: #fff; }
.chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
.chart-grid .card { padding: 12px 16px; }
.chart-container { position: relative; height: 220px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { text-align: left; padding: 10px 12px; font-weight: 600; color: var(--text2); font-size: 11px; text-transform: uppercase; letter-spacing: .3px; border-bottom: 1px solid var(--border); }
td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
tr { transition: background .12s; }
tr:hover td { background: var(--primary-glow); }
.price { font-weight: 700; font-variant-numeric: tabular-nums; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 8px; font-size: 10px; font-weight: 600; white-space: nowrap; }
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(6px); z-index: 1000; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 20px; width: 520px; max-width: 94vw; max-height: 94vh; overflow-y: auto; box-shadow: 0 8px 40px rgba(0,0,0,.3); }
.modal h2 { font-size: 16px; font-weight: 700; margin-bottom: 14px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.form-grid .full { grid-column: 1 / -1; }
label { display: block; font-size: 10px; font-weight: 600; color: var(--text2); margin-bottom: 3px; text-transform: uppercase; letter-spacing: .4px; }
label .req { color: var(--red); font-size: 12px; }
.user-box { margin-top: 10px; padding: 10px 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; display: flex; align-items: center; gap: 10px; }
.user-box .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex-shrink: 0; }
.user-box .meta { flex: 1; min-width: 0; }
.user-box .meta .uname { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-box .meta .role { font-size: 11px; color: var(--text2); }
.user-box button { background: none; border: none; color: var(--text2); cursor: pointer; font-size: 15px; padding: 4px; border-radius: 8px; }
.user-box button:hover { color: var(--red); background: rgba(231,76,60,.12); }
input, select, textarea { width: 100%; padding: 7px 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: inherit; font-size: 12px; outline: none; transition: all .18s; }
input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-glow); }
textarea { resize: vertical; min-height: 44px; }
select option { background: var(--surface); }
.input-group { display: flex; gap: 6px; align-items: flex-start; }
.input-group select { flex: 1; }
.input-group input { flex: 1; }
.hidden { display: none !important; }
.filters { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
.filters input, .filters select { width: auto; min-width: 120px; }
.filters .search { flex: 1; min-width: 160px; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes liftIn { from { opacity: 0; transform: translateY(30px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 8px var(--primary-glow); } 50% { box-shadow: 0 0 20px var(--primary-glow); } }
.fade-in { animation: fadeIn .3s ease; }
.slide-up { animation: slideUp .4s ease; }
.insights { margin-bottom: 20px; display: grid; gap: 6px; }
.insight-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 16px; display: flex; align-items: flex-start; gap: 12px; animation: slideUp .35s ease; transition: all .2s; }
.insight-card:hover { border-color: var(--primary); }
.insight-icon { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
.insight-icon.red { background: rgba(220,38,38,0.12); }
.insight-icon.green { background: rgba(22,163,74,0.12); }
.insight-icon.blue { background: rgba(37,99,235,0.12); }
.insight-icon.amber { background: rgba(217,119,6,0.12); }
.insight-text { flex: 1; }
.insight-text strong { display: block; font-size: 13px; margin-bottom: 1px; }
.insight-text p { font-size: 12px; color: var(--text2); line-height: 1.5; }
.empty-state { text-align: center; padding: 48px 16px; color: var(--text2); }
.empty-state .icon { font-size: 42px; margin-bottom: 12px; opacity: .6; }
.empty-state h3 { font-size: 16px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
.empty-state p { font-size: 13px; max-width: 320px; margin: 0 auto 16px; line-height: 1.5; }
.stat-change { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 20px; }
.stat-change.up { color: var(--green); background: rgba(22,163,74,0.12); }
.stat-change.down { color: var(--red); background: rgba(220,38,38,0.12); }
.stat-change.neutral { color: var(--text2); background: rgba(107,114,128,0.1); }
.theme-btn { width: 100%; padding: 8px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface2); color: var(--text2); cursor: pointer; font-size: 12px; font-family: inherit; transition: all .18s; display: flex; align-items: center; justify-content: center; gap: 6px; }
.theme-btn:hover { border-color: var(--primary); color: var(--primary); }
@media (max-width: 900px) {
  .sidebar { display: none; }
  .main { max-width: 100vw; padding: 16px; }
  .chart-grid { grid-template-columns: 1fr; }
  .row { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
  .form-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-logo"><span>TP</span>Tyre Price Intel</div>
    <div class="nav-item active" data-view="dashboard"><span class="icon">&#9632;</span> Dashboard</div>
    <div class="nav-item" onclick="openModal(null)"><span class="icon">+</span> New Record</div>
    <div class="nav-item" data-view="records"><span class="icon">&#9776;</span> All Records</div>
    <div class="nav-item hidden" id="navUsers" data-view="users"><span class="icon">&#128101;</span> Users</div>
    <div style="margin-top:auto;padding-top:16px;border-top:1px solid var(--border);margin-top:16px;">
      <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙 Night Mode</button>
      <div class="nav-item hidden" id="navReset" onclick="resetSharedData()" style="margin-top:8px"><span class="icon">&#128465;</span> Reset Data</div>
      <div class="user-box" id="userBox"></div>
    </div>
  </aside>

  <main class="main" id="app">
    <!-- Dynamic content rendered here -->
  </main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal fade-in">
    <h2 id="modalTitle">Add Entry</h2>
    <div class="form-grid">
      <div class="full"><label>Tyre Size <span class="req">*</span></label>
        <div class="input-group">
          <select id="fSizeSelect" onchange="toggleSizeInput()"></select>
          <input id="fSizeInput" class="hidden" placeholder="Enter size" oninput="syncSizeSelect()">
        </div>
      </div>
      <div class="full"><label>Brand / Competitor <span class="req">*</span></label>
        <div class="input-group">
          <select id="fCompSelect" onchange="toggleCompInput()"></select>
          <input id="fCompInput" class="hidden" placeholder="Enter brand" oninput="syncCompSelect()">
        </div>
      </div>
      <div class="full"><label>Pattern / Model</label>
        <div class="input-group">
          <select id="fPatternSelect" onchange="togglePatternInput()"></select>
          <input id="fPatternInput" class="hidden" placeholder="Enter pattern" oninput="syncPatternSelect()">
        </div>
      </div>
      <div><label>Category <span class="req">*</span></label><select id="fCategory"><option>OTR</option><option>Industrial</option><option>Solid</option><option>Truck & Bus</option><option>OTB</option><option>LCV/LT</option></select></div>
      <div><label>Source <span class="req">*</span></label><select id="fSource"><option>Dealer Quote</option><option>Website</option><option>Invoice</option><option>Market Visit</option><option>Phone Inquiry</option><option>Competitor Price List</option><option>Other</option></select></div>
      <div><label>Price (AED) <span class="req">*</span></label><input type="number" id="fPrice" step="0.01" min="0" placeholder="e.g. 4250"></div>
      <div class="full"><label>Dealer / Distributor</label>
        <div class="input-group">
          <select id="fDealerSelect" onchange="toggleDealerInput()"></select>
          <input id="fDealerInput" class="hidden" placeholder="Enter dealer" oninput="syncDealerSelect()">
        </div>
      </div>
      <div><label>Verified On</label><input type="date" id="fVerified"></div>
      <div class="full"><label>Notes</label><textarea id="fNotes" placeholder="Feedback, stock info, etc."></textarea></div>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="modalSaveBtn" onclick="saveEntry()">Save</button>
    </div>
  </div>
</div>

<script>
// ======================== DATA LAYER ========================
// Paste your deployed Google Apps Script web app URL here, e.g.
// https://script.google.com/macros/s/XXXXXXXXXXXX/exec
const API_URL = 'https://script.google.com/macros/s/AKfycbzuIIA9dw3DLBgbyetnZgeuSxdO2AoftlnfToQBEXikleIIzB2aTS6RLcjdHGOIT1es/exec';
const THEME_KEY = 'theme';

const DEFAULT_BRANDS = ['MRF','Ceat','Apollo','Bridgestone','Goodyear','Michelin','JK Tyre','Continental','Pirelli','Hankook','Yokohama','Kumho','Dunlop','Firestone','GT Radial','Maxxis','Nankang','Toyo','Falken','Cooper'];
const DEFAULT_SIZES = [
  '18.00R33','21.00R35','24.00R35','27.00R49','33.00R51','36.00R51','40.00R57','45/65R45','50/80R57',
  '6.50-10','7.00-12','7.00-15','8.25-15','10.00-20','12.00-20','16.5-16.5','23.5-25',
  '4.00-8','5.00-8',
  '12.00R20','295/80R22.5','315/80R22.5','11R22.5','12R22.5','13R22.5','215/75R17.5','235/75R17.5','245/70R19.5','265/70R19.5','275/70R22.5','295/60R22.5',
  '7.50R16','8R19.5','9R22.5','10R22.5',
  '155R12','165R13','175R13','175R14','185R14','195R14','205/70R15','215/75R15','235/75R15','245/75R16'
];
const DEFAULT_PATTERNS = ['V-Steel','XDR','RL-5K','MineMaster','Forkmaster','Forkmax','Industria','Solid Tech','XSM','Solid King','Super Highway','Trak King','EnduRace','M729','Marathon','Traxx','Solidmax','OTB Drive','Coach Master','Amazer','R623','HCS','Wrangler','V-Steel E'];
const DEFAULT_DEALERS = ['Al Nabooda Tyre','Gargash Tyre','Al Futtaim','Zahid Tyre','Al Ansari Tyre','Apollo Distributor LLC','JK Tyre MEA','Continental MEA'];

const BRAND_COLORS = [
  '#3498db','#e74c3c','#27ae60','#f39c12','#6c5ce7','#1abc9c','#9b59b6','#e67e22',
  '#e84393','#00cec9','#0984e3','#00b894','#fdcb6e','#6c5ce7','#fd79a8','#a29bfe',
  '#55efc4','#fab1a0','#81ecec','#dfe6e9'
];

let data = [];
let charts = {};
let editId = null;
let customBrands = [];
let customSizes = [];
let customPatterns = [];
let customDealers = [];
let lastSync = 0;
let syncedJson = '';
let currentUser = null;
let usersList = [];

function getToken() { return localStorage.getItem('tpi_token') || ''; }
function setToken(t) { if (t) localStorage.setItem('tpi_token', t); else localStorage.removeItem('tpi_token'); }
function isAdmin() { return currentUser && currentUser.role === 'admin'; }

async function apiPost(body) {
  if (!body.token) body.token = getToken();
  const r = await fetch(API_URL, { method: 'POST', cache: 'no-store', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  if (!j.ok) {
    if (j.error === 'session-expired') { setToken(''); showLogin(); throw new Error('session-expired'); }
    throw new Error(j.error || 'Request failed');
  }
  return j;
}

async function login(username, password) {
  const j = await apiPost({ action: 'login', username, password });
  setToken(j.token);
  currentUser = j.user;
  localStorage.setItem('tpi_user', JSON.stringify(j.user));
  return j;
}
function logout() {
  apiPost({ action: 'logout' }).catch(() => {});
  setToken(''); currentUser = null;
  localStorage.removeItem('tpi_user');
  showLogin();
}

function recTime(e) { return new Date(e.verifiedOn || e.createdAt || 0).getTime(); }
function sortData() { data.sort((a, b) => recTime(b) - recTime(a)); }
function historyCount(entry) { return data.filter(d => d.size === entry.size && d.competitor === entry.competitor && d.pattern === entry.pattern).length; }
function historyBtnHtml(e) { return historyCount(e) > 1 ? '<button class="btn btn-sm btn-outline" onclick="showHistory(data.find(d => d.id === \'' + e.id + '\'))" title="History">📈</button>' : ''; }

async function loadData() {
  try {
    const j = await apiPost({ action: 'load' });
    data = Array.isArray(j.records) ? j.records : [];
    customBrands = Array.isArray(j.brands) ? j.brands : [];
    customSizes = Array.isArray(j.sizes) ? j.sizes : [];
    customPatterns = Array.isArray(j.patterns) ? j.patterns : [];
    customDealers = Array.isArray(j.dealers) ? j.dealers : [];
    usersList = Array.isArray(j.users) ? j.users : [];
    currentUser = j.whoami || null;
    sortData();
    lastSync = Date.now();
    syncedJson = JSON.stringify(j.records) + '|' + JSON.stringify([customBrands, customSizes, customPatterns, customDealers]);
    hideBanner();
    renderUserBox();
  } catch (err) {
    if (err && err.message === 'session-expired') return;
    showBanner('Cannot reach the shared database. Check that API_URL is set and the script is deployed.');
  }
}
async function apiAddRecord(record) { await apiPost({ action: 'add', record }); }
async function apiUpdateRecord(record) { await apiPost({ action: 'update', record }); }
async function apiDeleteRecord(id) { await apiPost({ action: 'delete', id }); }
async function apiMergeList(list, values) { await apiPost({ action: 'mergeList', list, values }); }

function ensureCustomBrand(val) {
  if (val && !DEFAULT_BRANDS.includes(val) && !customBrands.includes(val)) { customBrands.push(val); apiMergeList('brands', [val]).catch(() => {}); }
}
function ensureCustomSize(val) {
  if (val && !DEFAULT_SIZES.includes(val) && !customSizes.includes(val)) { customSizes.push(val); apiMergeList('sizes', [val]).catch(() => {}); }
}
function ensureCustomPattern(val) {
  if (val && !DEFAULT_PATTERNS.includes(val) && !customPatterns.includes(val)) { customPatterns.push(val); apiMergeList('patterns', [val]).catch(() => {}); }
}
function ensureCustomDealer(val) {
  if (val && !DEFAULT_DEALERS.includes(val) && !customDealers.includes(val)) { customDealers.push(val); apiMergeList('dealers', [val]).catch(() => {}); }
}

function getAllBrands() { return [...DEFAULT_BRANDS, ...customBrands]; }
function getAllSizes() { return [...DEFAULT_SIZES, ...customSizes]; }
function getAllPatterns() { return [...DEFAULT_PATTERNS, ...customPatterns]; }
function getAllDealers() { return [...DEFAULT_DEALERS, ...customDealers]; }

function getBrandIndex(name) {
  const all = getAllBrands();
  const idx = all.indexOf(name);
  return idx >= 0 ? idx : 0;
}
function getBrandColor(name) { return BRAND_COLORS[getBrandIndex(name) % BRAND_COLORS.length]; }
function getBrandBadgeHtml(name) {
  const c = getBrandColor(name);
  return '<span class="badge" style="background:' + c + '22;color:' + c + ';border:1px solid ' + c + '44">' + name + '</span>';
}

function showBanner(msg) {
  let b = document.getElementById('syncBanner');
  if (!b) {
    b = document.createElement('div');
    b.id = 'syncBanner';
    b.style.cssText = 'position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:2000;background:var(--red);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.4);display:flex;gap:10px;align-items:center;max-width:90vw';
    document.body.appendChild(b);
  }
  b.innerHTML = msg + ' <button class="btn btn-sm" style="background:#fff;color:var(--red)" onclick="loadData().then(render)">Retry</button>';
}
function hideBanner() { const b = document.getElementById('syncBanner'); if (b) b.remove(); }

function updateSyncPill() {

// ======================== MODAL ========================
function openModal(entry) {
  if (!currentUser) { showLogin(); return; }
  if (entry && !isAdmin()) { alert('Only the admin can edit records.'); return; }
  editId = entry ? entry.id : null;
  document.getElementById('modalTitle').textContent = editId ? 'Edit Entry' : 'New Entry';
  document.getElementById('modalSaveBtn').textContent = editId ? 'Update' : 'Save';
  renderSizeSelect('fSizeSelect','fSizeInput', entry ? entry.size : '');
  renderBrandSelect('fCompSelect','fCompInput', entry ? entry.competitor : 'MRF');
  renderPatternSelect('fPatternSelect','fPatternInput', entry ? entry.pattern : '');
  document.getElementById('fCategory').value = entry ? entry.category : 'OTR';
  document.getElementById('fSource').value = entry ? (entry.source || 'Dealer Quote') : 'Dealer Quote';
  document.getElementById('fPrice').value = entry ? entry.price : '';
  renderDealerSelect('fDealerSelect','fDealerInput', entry ? entry.dealer : '');
  document.getElementById('fVerified').value = entry ? (entry.verifiedOn || new Date().toISOString().slice(0,10)) : new Date().toISOString().slice(0,10);
  document.getElementById('fNotes').value = entry ? entry.notes : '';
  document.getElementById('modal').classList.add('open');
}
function closeModal() { document.getElementById('modal').classList.remove('open'); editId = null; }

function collectForm() {
  return {
    size: getSizeValue(), competitor: getCompValue(), pattern: getPatternValue(),
    category: document.getElementById('fCategory').value, source: document.getElementById('fSource').value,
    price: parseFloat(document.getElementById('fPrice').value), dealer: getDealerValue(),
    verifiedOn: document.getElementById('fVerified').value, notes: document.getElementById('fNotes').value.trim()
  };
}
function validateForm(f) {
  if (!f.price || f.price <= 0) { alert('Price (AED) is required and must be more than 0.'); return false; }
  if (!f.size) { alert('Tyre Size is required.'); return false; }
  if (!f.competitor) { alert('Brand / Competitor is required.'); return false; }
  if (!f.category) { alert('Category is required.'); return false; }
  if (!f.source) { alert('Source is required.'); return false; }
  return true;
}
async function saveEntry() {
  if (editId && !isAdmin()) { alert('Only the admin can edit records.'); return; }
  const f = collectForm();
  if (!validateForm(f)) return;
  ensureCustomBrand(f.competitor); ensureCustomSize(f.size); ensureCustomPattern(f.pattern); ensureCustomDealer(f.dealer);
  const now = new Date().toISOString();
  closeModal();
  if (editId) {
    const idx = data.findIndex(d => d.id === editId);
    if (idx < 0) return;
    const rec = { ...data[idx], ...f, updatedAt: now };
    data[idx] = rec;
    try { await apiUpdateRecord(rec); lastSync = Date.now(); updateSyncPill(); } catch (err) { showBanner('Could not sync update to shared database.'); }
  } else {
    const rec = { id: generateId(), ...f, createdAt: now, updatedAt: now, addedBy: currentUser ? currentUser.username : 'unknown' };
    data.unshift(rec);
    sortData();
    try { await apiAddRecord(rec); lastSync = Date.now(); updateSyncPill(); } catch (err) { showBanner('Could not sync new record to shared database.'); }
  }
  render();
}
async function deleteEntry(id) {
  if (!isAdmin()) { alert('Only the admin can delete records.'); return; }
  if (!confirm('Delete entry?')) return;
  data = data.filter(d => d.id !== id);
  try { await apiDeleteRecord(id); lastSync = Date.now(); updateSyncPill(); } catch (err) { showBanner('Deleted locally but could not sync to shared database.'); }
  render();
}

function resetSharedData() {
  if (!isAdmin()) { alert('Only the admin can reset data.'); return; }
  if (!confirm('Delete ALL data from the SHARED database? This affects every team member.')) return;
  apiPost({ action: 'reset' }).then(() => {
    data = []; customBrands = []; customSizes = []; customPatterns = []; customDealers = [];
    render(); updateSyncPill();
  }).catch(() => showBanner('Could not reset the shared database.'));
}

// ======================== HELPERS ========================
function getCat(cat) { return cat === 'All' ? data : data.filter(d => d.category === cat); }
function getStats(entries) {
  if (!entries.length) return { count:0, avg:0, min:0, max:0 };
  const p = entries.map(e => e.price).sort((a,b) => a - b);
  return { count: entries.length, avg: p.reduce((a,b) => a + b, 0) / p.length, min: p[0], max: p[p.length - 1] };
}
function formatPrice(n) { return 'AED ' + Number(n).toLocaleString('en-AE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function timeAgo(iso) {
  const diff = Date.now() - new Date(iso).getTime(), m = Math.floor(diff / 60000);
  if (m < 1) return 'now'; if (m < 60) return m + 'm'; const h = Math.floor(m / 60);
  if (h < 24) return h + 'h'; const d = Math.floor(h / 24);
  if (d < 30) return d + 'd'; return new Date(iso).toLocaleDateString('en-AE');
}
function shortDate(iso) { return new Date(iso).toLocaleDateString('en-AE', { day:'2-digit', month:'short' }); }

function destroyChart(k) { if (charts[k]) { charts[k].destroy(); delete charts[k]; } }

  charts[cId] = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: [{ label, data: vals, backgroundColor: color || 'rgba(108,92,231,0.7)', borderRadius: 4 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: v => 'AED ' + Number(v.raw).toLocaleString('en-AE') } } },
      scales: {
        y: { beginAtZero: false, grid: { color: 'rgba(128,128,128,0.08)' }, ticks: { color: '#8890a8', callback: v => 'AED ' + Number(v).toLocaleString('en-AE') } },
        x: { grid: { display: false }, ticks: { color: '#8890a8' } }
      }
    }
  });
}
function renderLineChart(cId, labels, datasets) {
  destroyChart(cId);
  const ctx = document.getElementById(cId); if (!ctx) return;
  const colors = ['#6c5ce7','#e74c3c','#27ae60','#f39c12','#3498db','#1abc9c','#9b59b6','#e67e22','#e84393','#00cec9'];
  charts[cId] = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets: datasets.map((ds, i) => ({ label: ds.label, data: ds.data, borderColor: colors[i % colors.length], backgroundColor: colors[i % colors.length] + '20', tension: .3, fill: false, pointRadius: 3, pointHoverRadius: 5 })) },
    options: {

      }
    }
  });

function showLogin() {
  const main = document.getElementById('app');
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.getElementById('userBox').innerHTML = '';
  main.innerHTML = `
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">
      <div class="card" style="width:100%;max-width:380px;padding:32px;animation:fadeIn .25s ease">

          <div class="sidebar-logo" style="justify-content:center;margin-bottom:12px"><span>TP</span>Tyre Price Intel</div>
          <p style="color:var(--text2);font-size:13px">Sign in to access the shared price database</p>
        </div>
        <label>Username</label>
        <input class="search" id="loginUser" style="width:100%;margin-bottom:12px" placeholder="Username" autocomplete="username">
        <label>Password</label>
        <input class="search" id="loginPass" type="password" style="width:100%;margin-bottom:16px" placeholder="Password" autocomplete="current-password">
        <div id="loginErr" style="color:var(--red);font-size:12px;margin-bottom:10px;min-height:16px"></div>
        <button class="btn btn-primary" style="width:100%" id="loginBtn" onclick="doLogin()">Sign In</button>
      </div>
    </div>`;
  setTimeout(() => {
    const u = document.getElementById('loginUser'), p = document.getElementById('loginPass');
    if (u) u.focus();
    if (p) p.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  }, 50);
}
async function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const err = document.getElementById('loginErr');
  const btn = document.getElementById('loginBtn');
  if (!u || !p) { err.textContent = 'Enter username and password.'; return; }
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    await login(u, p);
    err.textContent = '';
    renderUserBox();
    await loadData();
    switchView('dashboard');
  } catch (e) {
    err.textContent = (e.message === 'session-expired' ? 'Session expired. Sign in again.' : e.message || 'Login failed.');
    btn.disabled = false; btn.textContent = 'Sign In';
  }
}

function createUser() {
  const name = document.getElementById('nuName').value.trim();
  const username = document.getElementById('nuUser').value.trim().toLowerCase();
  const password = document.getElementById('nuPass').value;
  const role = document.getElementById('nuRole').value;
  const err = document.getElementById('nuErr');
  if (!username || !password) { err.textContent = 'Username and password are required.'; return; }
  if (password.length < 4) { err.textContent = 'Password must be at least 4 characters.'; return; }
  apiPost({ action: 'createUser', username, password, name, role }).then(j => {
    usersList = j.users; err.textContent = '';
    document.getElementById('newUserForm').classList.add('hidden');
    renderUsers(document.getElementById('app'));
  }).catch(e => { err.textContent = e.message; });
}
function editUser(username) {
  const u = usersList.find(x => x.username === username);
  if (!u) return;
  const np = prompt('New password for ' + username + ' (leave empty to keep current):');
  if (np === null) return;
  if (np && np.length < 4) { alert('Password must be at least 4 characters.'); return; }
  const nr = u.username === 'admin' ? 'admin' : prompt('Role for ' + username + ' (admin/user):', u.role);
  if (nr === null) return;
  if (nr !== 'admin' && nr !== 'user') { alert('Role must be admin or user.'); return; }
  apiPost({ action: 'updateUser', username, password: np || undefined, role: nr, name: u.name }).then(j => {
    usersList = j.users;
    if (u.username === currentUser.username && nr !== currentUser.role) currentUser = { ...currentUser, role: nr };
    renderUsers(document.getElementById('app'));
    renderUserBox();
  }).catch(e => alert(e.message));
}
function deleteUser(username) {
  if (!confirm('Delete user "' + username + '"?')) return;
  apiPost({ action: 'deleteUser', username }).then(j => {
    usersList = j.users;
    renderUsers(document.getElementById('app'));
  }).catch(e => alert(e.message));
}

          <thead><tr><th>Brand</th><th>Category</th><th>Size</th><th style="text-align:right">Price</th><th>Source</th><th>Dealer</th><th>Added By</th><th>Added</th><th style="text-align:center">History</th></tr></thead>
          <tbody>${filtered.slice(0,8).map(e => `
            <tr><td>${getBrandBadgeHtml(e.competitor)}</td><td>${e.category}</td><td>${e.size}</td>
            <td style="text-align:right" class="price">${formatPrice(e.price)}</td>
            <td>${e.source || '—'}</td><td>${e.dealer || '—'}</td>
            <td>${e.addedBy ? '<b style="font-size:12px">' + e.addedBy + '</b>' : '—'}</td><td>${timeAgo(e.createdAt)}</td>
            <td style="text-align:center">${historyBtnHtml(e)}</td></tr>
          `).join('')}</tbody>
        </table>
      </div>` : `<div class="empty-state"><div class="icon">&#128202;</div><h3>No data yet</h3><p>Start by adding your first competitor price entry.</p><button class="btn btn-primary" onclick="openModal(null)">Add First Record</button></div>`}
    </div>
  `;

  document.querySelectorAll('.tab').forEach(el => {
    el.addEventListener('click', () => { document.querySelectorAll('.tab').forEach(t => t.classList.remove('active')); el.classList.add('active'); render(); });
  });
  setTimeout(() => { drawSizeChart(filtered); drawBrandChart(filtered); drawTrendChart(trendData, cat); }, 50);
}

function drawSizeChart(entries) {
  const g = {};
  entries.forEach(e => { if (!g[e.size]) g[e.size] = []; g[e.size].push(e.price); });
  const s = Object.entries(g).map(([s, p]) => ({ s, avg: p.reduce((a,b)=>a+b,0)/p.length })).sort((a,b) => b.avg - a.avg).slice(0, 10);
  if (!s.length) { destroyChart('chartSize'); return; }
  renderBarChart('chartSize', s.map(x => x.s), s.map(x => Math.round(x.avg)), 'Avg Price', 'rgba(52,152,219,0.7)');
}
function drawBrandChart(entries) {
  const g = {};
  entries.forEach(e => { if (!g[e.competitor]) g[e.competitor] = []; g[e.competitor].push(e.price); });
  const b = Object.entries(g).map(([b, p]) => ({ b, avg: p.reduce((a,b)=>a+b,0)/p.length })).sort((a,b) => b.avg - a.avg);
  if (!b.length) { destroyChart('chartBrand'); return; }
  const colors = b.map(x => getBrandColor(x.b) + '99');
  renderBarChart('chartBrand', b.map(x => x.b), b.map(x => Math.round(x.avg)), 'Avg Price', colors);
}
function buildTrendData(entries) {
  const g = {};
  entries.forEach(e => {
    const d = new Date(e.verifiedOn || e.createdAt).toLocaleDateString('en-AE');
    if (!g[e.competitor]) g[e.competitor] = {};
    if (!g[e.competitor][d]) g[e.competitor][d] = [];
    g[e.competitor][d].push(e.price);
  });
  const a = {};
  Object.keys(g).forEach(c => { a[c] = {}; Object.keys(g[c]).forEach(d => { a[c][d] = g[c][d].reduce((a,b)=>a+b,0) / g[c][d].length; }); });
  return a;
}
function drawTrendChart(ca, cat) {
  const ds = new Set();
  Object.values(ca).forEach(d => Object.keys(d).forEach(x => ds.add(x)));
  const sd = Array.from(ds).sort((a,b) => { const [da,ma,ya]=a.split('/').map(Number), [db,mb,yb]=b.split('/').map(Number); return new Date(ya,ma-1,da)-new Date(yb,mb-1,db); });
  if (!sd.length || !Object.keys(ca).length) { destroyChart('chartTrend'); return; }
  renderLineChart('chartTrend', sd, Object.keys(ca).map(c => ({ label: c, data: sd.map(d => ca[c][d] || null) })));
}

// ======================== INSIGHTS ========================
function generateInsights(selectedCat) {
  const list = [], filtered = selectedCat === 'All' ? data : data.filter(d => d.category === selectedCat);
  if (!filtered.length) return list;
  const byComp = {};
  filtered.forEach(e => { if (!byComp[e.competitor]) byComp[e.competitor] = []; byComp[e.competitor].push(e); });
  const ca = Object.entries(byComp).map(([c, e]) => ({ c, avg: e.reduce((a,b)=>a+b.price,0)/e.length })).sort((a,b) => a.avg - b.avg);
  if (ca.length >= 2) { const ch = ca[0]; list.push({ title: 'Price Leader: ' + ch.c, text: ch.c + ' lowest avg ' + formatPrice(ch.avg) + ', ' + formatPrice(ca[1].avg - ch.avg) + ' below next.', color: 'green', icon: '📊' }); }
  const recent = [...filtered].sort((a,b) => new Date(b.updatedAt) - new Date(a.updatedAt));
  if (recent.length) { const r = recent[0]; list.push({ title: 'Latest Update', text: r.competitor + ' ' + r.size + ' (' + r.category + ') at ' + formatPrice(r.price) + ' from ' + (r.source||'unknown'), color: 'blue', icon: '🕐' }); }
  const byKey = {};
  filtered.forEach(e => { const k = e.competitor+'|'+e.size+'|'+e.category; if (!byKey[k]) byKey[k] = []; byKey[k].push(e); });
  Object.values(byKey).forEach(e => {
    if (e.length < 2) return;
    const s = e.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt)), l = s[0].price, p = s[1].price, ch = ((l-p)/p*100);
    if (ch <= -2) list.push({ title: 'Price Drop', text: s[0].competitor+' '+s[0].size+' dropped '+Math.abs(ch).toFixed(1)+'% ('+formatPrice(p)+' → '+formatPrice(l)+')', color: 'red', icon: '⬇️' });
    else if (ch >= 2) list.push({ title: 'Price Hike', text: s[0].competitor+' '+s[0].size+' increased '+ch.toFixed(1)+'% ('+formatPrice(p)+' → '+formatPrice(l)+')', color: 'amber', icon: '⬆️' });
  });
  return list.slice(0, 5);
}

// ======================== RECORDS ========================
function renderRecords(main) {
  const search = (document.getElementById('filterSearch')?.value || '').toLowerCase();
  const catV = document.getElementById('filterCat')?.value || 'All';
  const compV = document.getElementById('filterComp')?.value || 'All';
  const sizeV = document.getElementById('filterSize')?.value || 'All';

  function available(field, ignoreField) {
    let pool = [...data];
    if (search) pool = pool.filter(d => [d.size,d.pattern||'',d.competitor,d.category,d.dealer||''].some(v => v.toLowerCase().includes(search)));
    if (ignoreField !== 'cat' && catV !== 'All') pool = pool.filter(d => d.category === catV);
    if (ignoreField !== 'comp' && compV !== 'All') pool = pool.filter(d => d.competitor === compV);
    if (ignoreField !== 'size' && sizeV !== 'All') pool = pool.filter(d => d.size === sizeV);
    return [...new Set(pool.map(d => d[field]))].sort();
  }

  let f = [...data];
  if (catV !== 'All') f = f.filter(d => d.category === catV);
  if (compV !== 'All') f = f.filter(d => d.competitor === compV);
  if (sizeV !== 'All') f = f.filter(d => d.size === sizeV);
  if (search) f = f.filter(d => [d.size,d.pattern||'',d.competitor,d.category,d.dealer||''].some(v => v.toLowerCase().includes(search)));

  const stats = getStats(f);

  const catOpts = available('category', 'cat');
  const compOpts = available('competitor', 'comp');
  const sizeOpts = available('size', 'size');

  main.innerHTML = `
    <div class="header">
      <div><h1>All Records</h1><p>${f.length} of ${data.length} entries</p></div>
      <div class="header-actions"><button class="btn btn-primary" onclick="openModal(null)">+ Add</button><button class="btn btn-outline" onclick="exportCSV()">CSV</button><button class="btn btn-outline" onclick="exportExcel()">Excel</button></div>
    </div>
    <div class="row">
      <div class="card stat-card" style="animation-delay:0s"><div class="stat-label">Filtered</div><div class="stat-value">${f.length}</div></div>
      <div class="card stat-card" style="animation-delay:.08s"><div class="stat-label">Avg</div><div class="stat-value">${f.length ? formatPrice(stats.avg) : '—'}</div></div>
      <div class="card stat-card" style="animation-delay:.16s"><div class="stat-label">Min</div><div class="stat-value">${f.length ? formatPrice(stats.min) : '—'}</div></div>
      <div class="card stat-card" style="animation-delay:.24s"><div class="stat-label">Max</div><div class="stat-value">${f.length ? formatPrice(stats.max) : '—'}</div></div>
    </div>
    <div class="filters">
      <input class="search" id="filterSearch" placeholder="Search size, brand, dealer..." oninput="reRenderRecords()">
      <select id="filterCat" onchange="reRenderRecords()">
        <option value="All">All Categories</option>
        ${catOpts.map(v => '<option value="'+v+'">'+v+'</option>').join('')}
      </select>
      <select id="filterComp" onchange="reRenderRecords()">
        <option value="All">All Brands</option>
        ${compOpts.map(v => '<option value="'+v+'">'+v+'</option>').join('')}
      </select>
      <select id="filterSize" onchange="reRenderRecords()">
        <option value="All">All Sizes</option>
        ${sizeOpts.map(v => '<option value="'+v+'">'+v+'</option>').join('')}
      </select>
      <button class="btn btn-sm btn-outline" onclick="resetFilters()" title="Reset filters">&#8635; Reset</button>
    </div>
    ${f.length ? `
    <div class="card" style="padding:0">
      <div class="table-wrap">
        <table><thead><tr><th>Brand</th><th>Cat</th><th>Size</th><th>Pattern</th><th style="text-align:right">Price</th><th>Source</th><th>Dealer</th><th>Verified</th><th>Added By</th><th style="text-align:center">Actions</th></tr></thead>
        <tbody>${f.map(e => `
          <tr><td>${getBrandBadgeHtml(e.competitor)}</td><td>${e.category}</td><td>${e.size}</td><td>${e.pattern || '—'}</td>
          <td style="text-align:right" class="price">${formatPrice(e.price)}</td>
          <td>${e.source || '—'}</td><td style="max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e.dealer || '—'}</td>
          <td>${e.verifiedOn ? shortDate(e.verifiedOn) : '—'}</td>
          <td>${e.addedBy ? '<b style="font-size:12px">' + e.addedBy + '</b>' : '—'}</td>
          <td style="text-align:center">
            ${historyBtnHtml(e)}
            ${isAdmin() ? `
            <button class="btn btn-sm btn-outline" onclick="openModal(data.find(d => d.id === '${e.id}'))" title="Edit">✎</button>
            <button class="btn btn-sm btn-danger" onclick="deleteEntry('${e.id}')" title="Delete">✕</button>` : ''}
          </td></tr>
        `).join('')}</tbody></table>
      </div>
    </div>` : `<div class="empty-state"><div class="icon">&#128270;</div><h3>No matching records</h3><p>Try different filters or add entries.</p><button class="btn btn-primary" onclick="openModal(null)">Add Record</button></div>`}
  `;
  document.getElementById('filterCat').value = catV;
  document.getElementById('filterComp').value = compV;
  document.getElementById('filterSize').value = sizeV;
  if (search) { const el = document.getElementById('filterSearch'); el.value = search; el.focus(); el.setSelectionRange(search.length, search.length); }
}

function reRenderRecords() {
  render();
  const el = document.getElementById('filterSearch');
  if (el && el.value) setTimeout(() => { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }, 10);
}

function resetFilters() {
  const s = document.getElementById('filterSearch'); if (s) s.value = '';
  const c = document.getElementById('filterCat'); if (c) c.value = 'All';
  const b = document.getElementById('filterComp'); if (b) b.value = 'All';
  const z = document.getElementById('filterSize'); if (z) z.value = 'All';
  render();
  setTimeout(() => { const e = document.getElementById('filterSearch'); if (e) e.focus(); }, 10);
}

// ======================== HISTORY ========================
let historyChart = null;
function showHistory(entry) {
  if (!entry || !data.length) return;
  const matches = data.filter(d => d.size === entry.size && d.competitor === entry.competitor && d.pattern === entry.pattern)
    .sort((a, b) => recTime(b) - recTime(a));
  if (matches.length < 2) { alert('Only one record exists for this size + brand + pattern combination.'); return; }

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px';
  overlay.addEventListener('click', e => { if (e.target === overlay) { if (historyChart) { historyChart.destroy(); historyChart = null; } overlay.remove(); } });

  overlay.innerHTML = `
    <div class="card" style="width:100%;max-width:780px;max-height:90vh;overflow-y:auto;padding:24px;animation:fadeIn .2s ease">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <div><h2 style="margin:0">${getBrandBadgeHtml(entry.competitor)} ${entry.size} ${entry.pattern ? '— ' + entry.pattern : ''}</h2><p style="margin:4px 0 0;opacity:.6">${matches.length} records · ${matches[0].category} · ordered by Verified On</p></div>
        <button class="btn btn-sm btn-outline" onclick="const o=this.closest('.modal-overlay');if(historyChart){historyChart.destroy();historyChart=null}o.remove()" title="Close">✕</button>
      </div>
      ${matches.length > 1 ? `<div class="chart-container" style="height:200px;margin-bottom:16px"><canvas id="historyChart"></canvas></div>` : ''}
      <div class="table-wrap">
        <table>
          <thead><tr><th style="text-align:right">#</th><th>Verified On</th><th style="text-align:right">Price</th><th>Source</th><th>Dealer</th><th>Added By</th><th>Notes</th></tr></thead>
          <tbody>${matches.map((e, i) => `
            <tr>
              <td style="text-align:right">${matches.length - i}</td>
              <td>${e.verifiedOn ? shortDate(e.verifiedOn) : '—'}</td>
              <td style="text-align:right" class="price">${formatPrice(e.price)}</td>
              <td>${e.source || '—'}</td>
              <td>${e.dealer || '—'}</td>
              <td>${e.addedBy ? '<b style="font-size:12px">' + e.addedBy + '</b>' : '—'}</td>
              <td style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e.notes || '—'}</td>
            </tr>
          `).join('')}</tbody>
        </table>
      </div>
    </div>`;

  document.body.appendChild(overlay);

  if (matches.length > 1) {
    setTimeout(() => {
      const canvas = document.getElementById('historyChart');
      if (!canvas) return;
      destroyChart('historyChart');
      const ctx = canvas.getContext('2d');
      const sorted = [...matches].sort((a, b) => recTime(a) - recTime(b));
      const labels = sorted.map(e => e.verifiedOn ? shortDate(e.verifiedOn) : shortDate(e.createdAt));
      const prices = sorted.map(e => e.price);
      historyChart = new Chart(ctx, {
        type: 'line',
        data: { labels, datasets: [{ label: 'Price (AED)', data: prices, borderColor: '#3498db', backgroundColor: 'rgba(52,152,219,0.1)', fill: true, tension: .3, pointRadius: 5, pointBackgroundColor: '#3498db' }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: false, ticks: { callback: v => v.toLocaleString() } } } }
      });
    }, 50);
  }
}

// ======================== EXPORT ========================
function exportCSV() {
  if (!data.length) { alert('No data.'); return; }
  const h = ['Size','Brand','Pattern','Category','Source','Price (AED)','Dealer','Verified On','Added By','Notes','Created','Updated'];
  const csv = [h.join(',')].concat(data.map(e => [e.size, e.competitor, e.pattern||'', e.category, e.source||'', e.price, (e.dealer||'').replace(/,/g,';'), e.verifiedOn||'', e.addedBy||'', (e.notes||'').replace(/,/g,';'), e.createdAt, e.updatedAt].join(','))).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'tyre_prices_' + new Date().toISOString().slice(0,10) + '.csv'; a.click();
}

function exportExcel() {
  const search = (document.getElementById('filterSearch')?.value || '').toLowerCase();
  const catV = document.getElementById('filterCat')?.value || 'All';
  const compV = document.getElementById('filterComp')?.value || 'All';
  const sizeV = document.getElementById('filterSize')?.value || 'All';
  let f = [...data];
  if (catV !== 'All') f = f.filter(d => d.category === catV);
  if (compV !== 'All') f = f.filter(d => d.competitor === compV);
  if (sizeV !== 'All') f = f.filter(d => d.size === sizeV);
  if (search) f = f.filter(d => [d.size,d.pattern||'',d.competitor,d.category,d.dealer||''].some(v => v.toLowerCase().includes(search)));
  if (!f.length) { alert('No filtered records to export.'); return; }
  const rows = f.map(e => ({ Size: e.size, Brand: e.competitor, Pattern: e.pattern||'', Category: e.category, Source: e.source||'', 'Price (AED)': e.price, Dealer: e.dealer||'', 'Verified On': e.verifiedOn||'', 'Added By': e.addedBy||'', Notes: e.notes||'', Created: e.createdAt, Updated: e.updatedAt }));
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = Object.keys(rows[0]).map((_, i) => ({ wch: i < 3 ? 18 : i === 5 ? 14 : 20 }));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Prices');
  XLSX.writeFile(wb, 'tyre_prices_' + new Date().toISOString().slice(0,10) + '.xlsx');
}

// ======================== NAVIGATION ========================
function switchView(view) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.view === view));
  render();
}

document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.nav-item[data-view]').forEach(el => el.addEventListener('click', () => switchView(el.dataset.view)));
  const app = document.getElementById('app');
  if (app) app.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text2)"><div style="text-align:center"><div style="font-size:40px;margin-bottom:12px">⏳</div><div>Connecting…</div></div></div>';
  const savedUser = localStorage.getItem('tpi_user');
  if (savedUser) { try { currentUser = JSON.parse(savedUser); } catch { currentUser = null; } }
  loadData().then(() => { render(); updateSyncPill(); });

  setInterval(async () => {
    const active = document.activeElement;
    const typing = active && (active.tagName === 'INPUT' || active.tagName === 'SELECT' || active.tagName === 'TEXTAREA');
    if (typing || document.querySelector('.modal-overlay') || !currentUser) return;
    try {
      const j = await apiPost({ action: 'load' });
      const sig = JSON.stringify(j.records) + '|' + JSON.stringify([j.brands, j.sizes, j.patterns, j.dealers]);
      if (sig !== syncedJson) { syncedJson = sig; data = j.records || []; customBrands = j.brands || []; customSizes = j.sizes || []; customPatterns = j.patterns || []; customDealers = j.dealers || []; sortData(); render(); }
      lastSync = Date.now(); updateSyncPill(); hideBanner();
    } catch (err) { updateSyncPill(); }
  }, 20000);

  document.addEventListener('visibilitychange', () => { if (!document.hidden && currentUser) { loadData().then(render); } });
});
document.getElementById('modal')?.addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
</script>
